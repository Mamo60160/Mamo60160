name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/fetch_activity.py
      - run: python scripts/make_boot_svg.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_skills_svg.py
      - uses: Platane/snk@v3.5
        with:
          github_user_name: Mamo60160
          outputs: |
            snake.svg?palette=github-dark&color_snake=#39d353
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/*.json contrib-heatmap.svg boot-banner.svg skills-panel.svg snake.svg"
